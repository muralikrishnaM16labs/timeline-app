<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <meta name="apple-touch-fullscreen" content="yes">
  <meta name="apple-mobile-web-app-title" content="Clock">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Clock</title>
  <link rel="stylesheet" href="style.css?v=39">
</head>
<body>

  <!--
    WALLPAPER — a direct child of <body>, never nested inside a screen.
    Its background is mirrored onto <html> by setWallpaperBackground() so that
    iOS paints the same image into the safe areas (see style.css).
  -->
  <div id="wallpaper"></div>

  <!--
    capture="environment" sends iOS straight to the rear camera.
    Hidden off-screen rather than with display:none — Safari silently ignores
    a programmatic .click() on a file input that is not rendered.
  -->
  <input type="file" id="camera-input" class="hidden-file-input"
    accept="image/*" capture="environment"/>

  <!-- SCREEN 1 — PIN PAD -->
  <div id="screen-pin">
    <!-- Only the contents dim, so the black backdrop stays fully opaque. -->
    <div id="pin-content">
      <div id="pin-top">
        <div id="pin-title">Enter Passcode</div>
        <div id="pin-dots">
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
        </div>
      </div>
      <div id="pin-grid">
        <div class="pin-btn" data-num="1">1</div>
        <div class="pin-btn" data-num="2">2</div>
        <div class="pin-btn" data-num="3">3</div>
        <div class="pin-btn" data-num="4">4</div>
        <div class="pin-btn" data-num="5">5</div>
        <div class="pin-btn" data-num="6">6</div>
        <div class="pin-btn" data-num="7">7</div>
        <div class="pin-btn" data-num="8">8</div>
        <div class="pin-btn" data-num="9">9</div>
        <!-- Looks blank, like the Emergency key on iOS. Silently clears the
             entry so a mis-tapped first digit can be taken back. -->
        <div class="pin-btn empty" id="pin-clear"></div>
        <div class="pin-btn" data-num="0">0</div>
        <div class="pin-btn empty"></div>
      </div>
    </div>
  </div>

  <!-- SCREEN 2 — HOME SCREEN -->
  <div id="screen-home">

    <!--
      Our own status-bar clock, kept locked to the big clock by setDisplay().
      iOS paints its real status bar OVER this area, so while that bar is
      visible the two overlap. It reads correctly once the system bar is gone
      (Guided Access, or a native shell). Toggle in Settings.
    -->
    <!--
      Fake status bar. Both halves are off by default because iOS paints its
      own bar over this area and they would double up. Turn them on when the
      real bar is hidden — inside a fullscreen kiosk browser, say — and this
      becomes the only status bar on screen.
    -->
    <div id="status-bar">
      <div id="status-time">9:41</div>
      <div id="status-right">
        <!-- cellular bars -->
        <svg width="18" height="12" viewBox="0 0 19 12" aria-hidden="true">
          <rect x="0"    y="8.5" width="3.5" height="3.5" rx="1" fill="#fff"/>
          <rect x="4.7"  y="5.8" width="3.5" height="6.2" rx="1" fill="#fff"/>
          <rect x="9.4"  y="3"   width="3.5" height="9"   rx="1" fill="#fff"/>
          <rect x="14.1" y="0"   width="3.5" height="12"  rx="1" fill="#fff"/>
        </svg>
        <!-- wifi -->
        <svg width="17" height="12" viewBox="0 0 16 12" aria-hidden="true">
          <path d="M8 11.4 L5.9 8.9 A3.1 3.1 0 0 1 10.1 8.9 Z" fill="#fff"/>
          <path d="M3.9 6.6 A6.2 6.2 0 0 1 12.1 6.6" stroke="#fff"
            stroke-width="1.7" fill="none" stroke-linecap="round"/>
          <path d="M1.1 3.6 A10.4 10.4 0 0 1 14.9 3.6" stroke="#fff"
            stroke-width="1.7" fill="none" stroke-linecap="round"/>
        </svg>
        <!-- battery -->
        <svg width="27" height="13" viewBox="0 0 28 13" aria-hidden="true">
          <rect x="0.6" y="0.6" width="23.8" height="11.8" rx="3.4"
            stroke="#fff" stroke-opacity="0.5" fill="none"/>
          <rect id="battery-level" x="2.2" y="2.2" width="20.6" height="8.6"
            rx="2.2" fill="#fff"/>
          <path d="M26.1 4.4 v4.2 a2.2 2.2 0 0 0 0-4.2z" fill="#fff" fill-opacity="0.5"/>
        </svg>
      </div>
    </div>

    <div id="clock-wrap">
      <div id="clock-date">Monday, June 10</div>
      <div id="clock-time">9:41</div>
    </div>

    <div id="spacer"></div>

    <div id="bottom-bar">
      <!--
        Both glyphs are single evenodd paths, so the flashlight's switch and the
        camera's lens are real holes rather than shapes painted in a background
        colour. That means they invert for free when the torch lights up and the
        circle turns white.
      -->
      <div id="torch-btn">
        <!--
          flashlight.off.fill, the genuine Apple outline rather than a
          freehand copy. The export is drawn flipped (scale(1,-1)); every y has
          been baked to H-y and the path shifted so the viewBox is the glyph
          itself with no padding, because style.css sizes these as ratios of
          the button and interior padding would render the icon small.

          fill-rule is nonzero, as Apple authored it — the switch cut-out is a
          genuine hole, so it still inverts for free when the torch lights.
        -->
        <svg viewBox="0 0 26.9 65.05" aria-hidden="true">
          <path id="torch-glyph" fill="#fff" fill-rule="nonzero"
            d="M 0 6.34 L 0 5.35 Q 0 0 5.22 0 L 21.68 0 Q 26.9 0 26.9 5.35 L 26.9 6.34 Z M 10.87 65.05 Q 8.34 65.05 7 63.68 Q 5.67 62.3 5.67 59.68 L 5.67 27.91 Q 5.67 25.61 5.18 23.97 Q 4.68 22.32 3.87 21.05 L 2.26 18.56 Q 1.25 16.97 0.62 15.48 Q 0 13.99 0 12.14 L 0 9.32 L 26.9 9.32 L 26.9 12.14 Q 26.9 13.99 26.26 15.48 Q 25.63 16.97 24.62 18.56 L 23.03 21.05 Q 22.21 22.32 21.72 23.97 Q 21.23 25.61 21.23 27.91 L 21.23 59.68 Q 21.23 62.3 19.88 63.68 Q 18.54 65.05 16.03 65.05 Z M 8.64 30.42 L 8.64 38.59 Q 8.64 40.61 10.03 41.99 Q 11.43 43.38 13.47 43.38 Q 14.82 43.38 15.91 42.74 Q 16.99 42.11 17.63 41.02 Q 18.26 39.94 18.26 38.59 L 18.26 30.42 Q 18.26 29.07 17.63 27.98 Q 16.99 26.9 15.91 26.25 Q 14.82 25.61 13.47 25.61 Q 11.43 25.61 10.03 27.01 Q 8.64 28.4 8.64 30.42 Z M 13.47 41.68 Q 12.14 41.68 11.25 40.8 Q 10.36 39.92 10.36 38.59 Q 10.36 37.32 11.26 36.42 Q 12.16 35.51 13.47 35.51 Q 14.74 35.51 15.65 36.42 Q 16.56 37.32 16.56 38.59 Q 16.56 39.92 15.68 40.8 Q 14.8 41.68 13.47 41.68 Z" />
        </svg>
      </div>
      <div id="camera-btn">
        <!-- camera.fill, same treatment. The lens is a real hole. -->
        <svg viewBox="0 0 67.35 52.27" aria-hidden="true">
          <path id="camera-glyph" fill="#fff" fill-rule="nonzero"
            d="M 56.78 20.69 Q 58.18 20.69 59.17 19.7 Q 60.16 18.71 60.16 17.32 Q 60.16 15.94 59.17 14.95 Q 58.18 13.96 56.78 13.96 Q 55.41 13.96 54.42 14.95 Q 53.43 15.94 53.43 17.32 Q 53.43 18.71 54.42 19.7 Q 55.41 20.69 56.78 20.69 Z M 8.36 52.27 Q 4.21 52.27 2.11 50.19 Q 0 48.1 0 44 L 0 14.91 Q 0 10.81 2.11 8.72 Q 4.21 6.64 8.36 6.64 L 16.09 6.64 Q 17.19 6.64 17.86 6.49 Q 18.54 6.34 19.08 5.94 Q 19.62 5.54 20.24 4.83 L 22.52 2.28 Q 23.22 1.5 23.98 1 Q 24.73 0.49 25.7 0.25 Q 26.66 0 28.06 0 L 38.97 0 Q 40.37 0 41.35 0.25 Q 42.32 0.49 43.07 1 Q 43.81 1.5 44.52 2.28 L 46.79 4.83 Q 47.44 5.56 47.96 5.95 Q 48.49 6.34 49.17 6.49 Q 49.84 6.64 50.94 6.64 L 59 6.64 Q 63.14 6.64 65.25 8.72 Q 67.35 10.81 67.35 14.91 L 67.35 44 Q 67.35 48.1 65.25 50.19 Q 63.14 52.27 59 52.27 Z M 33.69 44.41 Q 36.85 44.41 39.6 43.24 Q 42.35 42.07 44.43 39.98 Q 46.51 37.9 47.7 35.13 Q 48.88 32.36 48.88 29.2 Q 48.88 26.02 47.71 23.26 Q 46.54 20.5 44.45 18.4 Q 42.37 16.31 39.61 15.14 Q 36.85 13.96 33.69 13.96 Q 30.53 13.96 27.77 15.14 Q 25.01 16.31 22.92 18.4 Q 20.84 20.5 19.67 23.26 Q 18.5 26.02 18.5 29.2 Q 18.5 32.36 19.67 35.13 Q 20.84 37.9 22.92 39.98 Q 25.01 42.07 27.77 43.24 Q 30.53 44.41 33.69 44.41 Z M 33.69 40.78 Q 31.28 40.78 29.19 39.89 Q 27.09 38.99 25.5 37.4 Q 23.91 35.81 23.01 33.71 Q 22.11 31.6 22.11 29.2 Q 22.11 26.77 23.01 24.67 Q 23.91 22.58 25.5 20.98 Q 27.09 19.38 29.19 18.49 Q 31.28 17.6 33.69 17.6 Q 36.07 17.6 38.18 18.49 Q 40.28 19.38 41.87 20.98 Q 43.46 22.58 44.35 24.67 Q 45.25 26.77 45.25 29.2 Q 45.25 31.6 44.35 33.71 Q 43.46 35.81 41.87 37.4 Q 40.28 38.99 38.18 39.89 Q 36.07 40.78 33.69 40.78 Z" />
        </svg>
      </div>
    </div>

    <!--
      The home indicator. Absolutely positioned, so turning it on never moves
      the buttons above it. Hidden by default: iOS draws its own over the safe
      area and the two would double up.
    -->
    <div id="home-indicator" class="hidden"></div>

  </div>

  <!-- SCREEN 3 — SECRET PANEL -->
  <div id="screen-secret">
    <div id="secret-inner">

      <div class="secret-title">⚙ Settings</div>

      <!--
        APPEARANCE — how the lock screen looks.
        Grouped by the element each setting affects, and deliberately using the
        same four names as the Layout section below (Clock, Buttons, Status
        Bar, Home Bar) so there is one taxonomy to learn rather than two.
        Everything starts collapsed: this panel is opened mid-performance, and
        a wall of rows to scroll is the last thing wanted then.
      -->
      <div class="settings-section">
        <div class="section-title">Appearance</div>

      <details class="settings-group">
        <summary>Wallpaper</summary>
        <div class="secret-row">
          <label>Wallpaper</label>
          <select id="wallpaper-select">
          <option value="ios">iOS Default</option>
          <option value="gradient1">Deep Purple</option>
          <option value="gradient2">Midnight Blue</option>
          <option value="gradient3">Dark Green</option>
          <option value="gradient4">Deep Red</option>
          <option value="gradient5">Pure Black</option>
          <option value="gradient6">Ocean Blue</option>
          <option value="gradient7">Sunset</option>
          <option value="custom">Custom Photo</option>
          </select>
        </div>
        <div class="secret-row" id="gallery-row" style="display:none">
          <label>Choose Photo</label>
          <input type="file" id="gallery-input" class="hidden-file-input"
            accept="image/*"/>
          <button id="gallery-btn">Open Gallery</button>
        </div>
      </details>

      <details class="settings-group">
        <summary>Clock</summary>
        <div class="secret-row">
          <label>Style</label>
          <select id="clock-style">
          <option value="glass" selected>Glass</option>
          <option value="solid">Solid</option>
          </select>
        </div>
        <div class="secret-row">
          <label>Colour</label>
          <select id="clock-color">
          <option value="#ffffff">White</option>
          <option value="#f59e0b">Gold</option>
          <option value="#22c55e">Green</option>
          <option value="#8b5cf6">Purple</option>
          <option value="#38bdf8">Blue</option>
          <option value="#f472b6">Pink</option>
          </select>
        </div>
        <div class="secret-row">
          <label>Date Format</label>
          <select id="date-format">
          <option value="short" selected>Tue Apr 1</option>
          <option value="full">Tuesday, April 1</option>
          </select>
        </div>
        <div class="secret-row">
          <label>Align</label>
          <select id="clock-align">
          <option value="center" selected>Center</option>
          <option value="flex-start">Left</option>
          <option value="flex-end">Right</option>
          </select>
        </div>
      </details>

      <details class="settings-group">
        <summary>Buttons</summary>
        <!-- Liquid Glass shapes both circles; the other two are the lit torch. -->
        <div class="secret-row">
          <label>Liquid Glass</label>
          <select id="glass-mode">
          <option value="clear" selected>Clear</option>
          <option value="tinted">Tinted</option>
          </select>
        </div>
        <div class="secret-row">
          <label>Torch Lit</label>
          <select id="torch-lit">
          <option value="blue" selected>Blue (accent)</option>
          <option value="white">White</option>
          <option value="wallpaper">Wallpaper tint</option>
          </select>
        </div>
        <div class="secret-row">
          <label>Torch Glyph</label>
          <select id="torch-glyph-mode">
          <option value="auto" selected>Auto</option>
          <option value="white">White</option>
          <option value="dark">Dark</option>
          </select>
        </div>
      </details>

      <details class="settings-group">
        <summary>Status Bar</summary>
        <!-- Both halves default to Hidden: iOS paints its own bar over this
             area, and the two would double up. -->
        <div class="secret-row">
          <label>Time</label>
          <select id="statusbar-time">
          <option value="hide" selected>Hidden</option>
          <option value="show">Match big clock</option>
          </select>
        </div>
        <div class="secret-row">
          <label>Icons</label>
          <select id="statusbar-icons">
          <option value="hide" selected>Hidden</option>
          <option value="show">Show</option>
          </select>
        </div>
        <div class="secret-row">
          <label>Battery Level</label>
          <select id="battery-level-select">
          <option value="100">100%</option>
          <option value="80" selected>80%</option>
          <option value="60">60%</option>
          <option value="40">40%</option>
          <option value="25">25%</option>
          <option value="10">10%</option>
          </select>
        </div>
      </details>

      <details class="settings-group">
        <summary>Home Bar</summary>
        <div class="secret-row">
          <label>Home Indicator</label>
          <select id="home-indicator-toggle">
          <option value="hide" selected>Hidden</option>
          <option value="show">Show</option>
          </select>
        </div>
      </details>
      </div>

      <!--
        LAYOUT — where things sit and how big they are, every value a
        percentage of the screen. Its groups are generated from LAYOUT_CONFIG.
      -->
      <div class="settings-section">
        <div class="section-title">Layout &mdash; % of screen</div>
        <div id="layout-info">viewport &mdash;</div>
        <div id="layout-rows"></div>
        <button id="reset-layout-btn">Reset to iOS proportions</button>
      </div>

      <!--
        PERFORMANCE — the trick itself: which way the time moves on the
        passcode digit, and how the countback runs. Four rows, left flat.
      -->
      <div class="settings-section">
        <div class="section-title">Performance</div>
        <div class="secret-row">
          <label>Time Direction</label>
          <select id="tap-direction">
          <option value="backward">Backward</option>
          <option value="forward">Forward</option>
          </select>
        </div>
        <div class="secret-row">
          <label>Unit</label>
          <select id="tap-unit">
          <option value="minutes">Minutes</option>
          <option value="hours">Hours</option>
          </select>
        </div>
        <div class="secret-row">
          <label>Start Delay</label>
          <!-- The beat between the spectator's tap and the countback starting.
               Long enough to look away and hand the phone over; short enough
               that nobody wonders whether anything is happening. -->
          <select id="start-delay">
            <option value="0">Instant</option>
            <option value="1000">1 second</option>
            <option value="2000">2 seconds</option>
            <option value="3000" selected>3 seconds</option>
            <option value="4000">4 seconds</option>
            <option value="5000">5 seconds</option>
            <option value="8000">8 seconds</option>
            <option value="10000">10 seconds</option>
          </select>
        </div>
        <div class="secret-row">
          <label>Roll Speed</label>
          <select id="anim-speed">
          <option value="slow">Slow</option>
          <option value="medium" selected>Medium</option>
          <option value="fast">Fast</option>
          </select>
        </div>
        <div class="secret-row">
          <label>Trigger</label>
          <select id="trigger-type">
          <option value="tap">Tap</option>
          <option value="tap-vibrate">Tap + Vibrate</option>
          </select>
        </div>
      </div>

      <div id="status-text">Not set</div>
      <button id="close-secret-btn">Close Settings</button>

    </div>
  </div>

  <script src="script.js?v=39"></script>
  <script>
    /*
     * Registers the precaching worker. Only runs in a secure context — over
     * plain http:// (a LAN IP, say) registration is unavailable and the app
     * simply runs without offline support.
     */
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    }
  </script>

</body>
</html>
